# prod 환경 compose.
# 이미지=ghcr(배포 시 버전·커밋 태그, 수동 실행 시 :prod), Postgres=Supabase(prod), Redis=Upstash(외부, .env.prod 의 PROD_REDIS_*), 이미지=R2.
# 설정: ./config 의 yml 마운트 + ./.env.prod 시크릿. HTTPS/라우팅은 호스트 nginx(EC2 에서 직접).
name: nalssilog-prod

services:
  app-prod:
    image: ghcr.io/nalssilog/api:${APP_IMAGE_TAG:-prod}
    container_name: nalssilog-app-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
    env_file:
      - .env.prod
    volumes:
      - ./config:/config:ro
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8081:8080"   # 호스트 nginx 만 접근
